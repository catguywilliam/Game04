<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏04 · 贪吃蛇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      color: #e0e0e0;
      user-select: none;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.2em;
      margin-bottom: 0.4rem;
      color: #4ade80;
      text-shadow: 0 0 12px #4ade80aa;
    }

    #scoreboard {
      display: flex;
      gap: 3rem;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    #scoreboard span { color: #a3a3a3; }
    #scoreboard strong { color: #f0f0f0; font-size: 1.2rem; }

    #gameCanvas {
      display: block;
      border: 2px solid #2d2d2d;
      border-radius: 6px;
      box-shadow: 0 0 30px #4ade8033;
      background: #111;
      image-rendering: pixelated;
    }

    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background: #000000cc;
      border-radius: 8px;
      padding: 2.5rem 3.5rem;
      text-align: center;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #4ade80;
      text-shadow: 0 0 10px #4ade8099;
    }

    #overlay p {
      color: #a3a3a3;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    #overlay button {
      margin-top: 0.5rem;
      padding: 0.6rem 2.2rem;
      font-size: 1rem;
      background: #4ade80;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: background 0.15s, transform 0.1s;
    }

    #overlay button:hover { background: #86efac; transform: scale(1.04); }
    #overlay button:active { transform: scale(0.97); }

    #wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #controls {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #555;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<h1>🐍 游戏04 · 贪吃蛇</h1>

<div id="scoreboard">
  <div><span>分数 </span><strong id="score">0</strong></div>
  <div><span>最高分 </span><strong id="best">0</strong></div>
  <div><span>关卡 </span><strong id="level">1</strong></div>
</div>

<div id="wrapper">
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>🐍 贪吃蛇</h2>
    <p>吃食物得分，避免撞墙和自身<br/>每 5 分升一关，速度逐渐加快</p>
    <button id="startBtn">开始游戏</button>
    <p style="font-size:0.75rem;color:#444">↑ ↓ ← → 或 WASD 控制方向</p>
  </div>
</div>

<div id="controls">
  方向键 / WASD 控制 &nbsp;·&nbsp; P 暂停 &nbsp;·&nbsp; R 重新开始
</div>

<script>
(function () {
  'use strict';

  const COLS = 20, ROWS = 20;
  const CELL = 20; // px per cell

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlayTitle = overlay.querySelector('h2');
  const overlayMsg = overlay.querySelector('p');

  let snake, dir, nextDir, food, score, best, level, paused, running, animId, lastTime, interval;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function initGame() {
    snake = [
      { x: 10, y: 10 },
      { x: 9,  y: 10 },
      { x: 8,  y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    paused = false;
    lastTime = 0;
    interval = 200; // ms between moves
    spawnFood();
    updateHUD();
  }

  function spawnFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snake_best', best);
    }
  }

  function setLevel() {
    level = Math.floor(score / 5) + 1;
    interval = Math.max(80, 200 - (level - 1) * 15);
  }

  // ---- Drawing ----
  const COLORS = {
    head:   '#4ade80',
    body:   '#22c55e',
    tail:   '#16a34a',
    food:   '#f87171',
    foodGlow: '#f8717188',
    grid:   '#161616',
    border: '#1e1e1e',
  };

  function drawGrid() {
    ctx.fillStyle = COLORS.grid;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = COLORS.border;
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(canvas.width, y * CELL);
      ctx.stroke();
    }
  }

  function drawRoundRect(x, y, w, h, r, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function drawSnake() {
    const n = snake.length;
    snake.forEach((seg, i) => {
      const px = seg.x * CELL, py = seg.y * CELL;
      const pad = 2;
      if (i === 0) {
        // Head
        drawRoundRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2, 4, COLORS.head);
        // Eyes
        const ex = dir.x, ey = dir.y;
        const cx = px + CELL / 2, cy = py + CELL / 2;
        const eyeOffset = 3.5;
        const eyeDist = 2.5;
        // perpendicular offset
        const px1 = cx + (-ey) * eyeOffset + ex * eyeDist;
        const py1 = cy + ex * eyeOffset + ey * eyeDist;
        const px2 = cx + ey * eyeOffset + ex * eyeDist;
        const py2 = cy + (-ex) * eyeOffset + ey * eyeDist;
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(px1, py1, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(px2, py2, 2, 0, Math.PI * 2); ctx.fill();
      } else {
        const ratio = i / n;
        const alpha = 1 - ratio * 0.4;
        ctx.globalAlpha = alpha;
        drawRoundRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2, 3,
          i === n - 1 ? COLORS.tail : COLORS.body);
        ctx.globalAlpha = 1;
      }
    });
  }

  function drawFood() {
    const px = food.x * CELL + CELL / 2;
    const py = food.y * CELL + CELL / 2;
    // glow
    const grd = ctx.createRadialGradient(px, py, 1, px, py, CELL * 0.7);
    grd.addColorStop(0, COLORS.foodGlow);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(px, py, CELL * 0.7, 0, Math.PI * 2);
    ctx.fill();
    // apple
    drawRoundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 5, COLORS.food);
  }

  function render() {
    drawGrid();
    drawFood();
    drawSnake();
  }

  // ---- Game loop ----
  function step(timestamp) {
    if (!running) return;
    animId = requestAnimationFrame(step);

    if (paused) { render(); return; }

    if (timestamp - lastTime < interval) { render(); return; }
    lastTime = timestamp;

    // Apply direction
    dir = { ...nextDir };

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver(); return;
    }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver(); return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      setLevel();
      updateHUD();
      spawnFood();
    } else {
      snake.pop();
    }

    render();
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(animId);
    render();

    // Flash effect
    ctx.fillStyle = 'rgba(239,68,68,0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    overlayTitle.textContent = score > 0 ? `💥 游戏结束 (${score}分)` : `💥 游戏结束`;
    overlayMsg.innerHTML = `得分：<strong style="color:#4ade80">${score}</strong> &nbsp;|&nbsp; 最高分：<strong style="color:#f0f0f0">${best}</strong>`;
    startBtn.textContent = '再来一局';
    overlay.style.display = 'flex';
  }

  function startGame() {
    overlay.style.display = 'none';
    initGame();
    running = true;
    animId = requestAnimationFrame(step);
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = '⏸ 已暂停';
      overlayMsg.textContent = '按 P 继续';
      startBtn.style.display = 'none';
      overlay.style.display = 'flex';
    } else {
      overlay.style.display = 'none';
      startBtn.style.display = '';
    }
  }

  // ---- Input ----
  const keyMap = {
    ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    ArrowDown:  { x: 0, y:  1 }, s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
    ArrowLeft:  { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    ArrowRight: { x:  1, y: 0 }, d: { x:  1, y: 0 }, D: { x:  1, y: 0 },
  };

  document.addEventListener('keydown', e => {
    const d = keyMap[e.key];
    if (d) {
      e.preventDefault();
      // Prevent reversing
      if (d.x !== 0 && d.x === -dir.x) return;
      if (d.y !== 0 && d.y === -dir.y) return;
      nextDir = d;
    }
    if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startGame(); }
  });

  startBtn.addEventListener('click', startGame);

  // Initial render
  drawGrid();
})();
</script>
</body>
</html>
